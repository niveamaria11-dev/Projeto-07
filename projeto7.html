<!DOCTYPE html>
<head>
    <title>Projeto 7</title>
</head>
<body>

    <header>
        <h1>Cadastro de Usuário</h1>
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Sobre Nós</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulário de Cadastro</h2>
            
            <form action="/enviar-dados" method="POST">
                
                
                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                
                <div>
                    <label for="genero">Gênero:</label>
                    <select id="genero" name="genero">
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                        <option value="outro">Outro / Não informar</option>
                    </select>
                </div>
                <div>
                    <label>Interesses:</label><br>
                    <input type="checkbox" id="programacao" name="interesses" value="programacao">
                    <label for="programacao">Programação</label><br>
                    
                    <input type="checkbox" id="jogos" name="interesses" value="jogos">
                    <label for="jogos">Jogos</label><br>
                    
                    <input type="checkbox" id="musica" name="interesses" value="musica">
                    <label for="musica">Música</label>
                </div>

                
                <div>
                    <label for="biografia">Biografia:</label><br>
                    <textarea id="biografia" name="biografia" rows="5" cols="40" placeholder="Conte um pouco sobre você..."></textarea>
                </div>

                <div>
                    <input type="submit" value="Enviar">
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>Site</p>
    </footer>

</body>
</html>
